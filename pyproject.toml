[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pypdf>=6.16.2",
    "requests>=2.34.2",
    "scipy>=1.15.3",
    "torch-geometric>=2.8.0.post1",
    "torch>=2.2",
    "networkx>=3.4.2",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
